<div class="row row-cols-1 row-cols-md-3 g-4">
    <div *ngFor="let plato of platos" class="col">
      <div class="card h-100">
        <img src="{{ plato.getImagen() }}" class="card-img-top" alt="...">
        <div class="card-body">
          <h5 class="card-title">{{ plato.getDia() }}</h5>
          <p class="card-text">{{ plato.getDescripcion() }}</p>
        </div>
        <div class="card-footer">
          <small class="text-body-secondary">Last updated 3 mins ago</small>
        </div>
      </div>
    </div>
</div>
