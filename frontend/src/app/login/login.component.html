<form class="container mb-3 card" id="loginform" [formGroup]="formulario" (ngSubmit)="login()">
  <h2 class="row justify-content-center mb-3">Iniciar Sesión</h2>
  <div class="row justify-content-center">
    <div class="col-xl-6">
      <div class="mb-3">
        <label class="form-label" for="email">Correo Electrónico</label>
        <input class="form-control" type="email" id="email" formControlName="email" name="email" required>
        <div id="emailHelp" class="form-text">We'll never share your email with anyone else.</div>
      </div>
      <div class="mb-3">
        <label for="contrasena" class="form-label">Password</label>
        <input class="form-control" type="password" id="contrasena" formControlName="contrasena" name="contrasena" required>
      </div>
      <select class="form-select mb-3" id="tipoUsuario"  formControlName="tipoUsuario" name="tipoUsuario" aria-label="Floating label select example">
        <option value="" disabled selected>Seleccione un tipo de usuario</option>
        <option value="ADMINISTRADOR">Administrador</option>
        <option value="RESPONSABLE-DE-TURNO">Responsable de Turno</option>
        <option value="ALUMNO">Alumno</option>
      </select>
      <button type="submit" class="btn btn-primary mb-3">Iniciar Sesión</button>
    </div>
  </div>
</form>
